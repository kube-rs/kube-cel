[package]
name = "kube-cel"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Kubernetes CEL extension functions for the cel crate"
repository = "https://github.com/kube-rs/kube-cel"
documentation = "https://docs.rs/kube-cel"
homepage = "https://kube.rs"
keywords = ["kubernetes", "cel", "kube", "validation"]
categories = ["api-bindings"]
exclude = ["justfile"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# PUBLIC dependency: `cel` is re-exported (`pub use cel`) and appears in public
# signatures (`Context`, `Value`, `Program`), so a `cel` semver bump is a
# breaking change for kube-cel. The caret `^0.13` is intentional — it lets
# downstreams pick up `cel` 0.13.x patches without a kube-cel release. Do not
# switch to an exact `=0.13.x` pin (it would block that patch uptake), and bump
# the major-coupling note in the versioning policy if this constraint changes.
cel = "0.14"
regex = { version = "1", optional = true }
url = { version = "2", optional = true }
ipnet = { version = "2", optional = true }
semver = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["strings", "lists", "sets", "regex_funcs", "urls", "ip", "semver_funcs", "format", "quantity", "jsonpatch", "named_format", "math", "encoders"]
strings = []
lists = []
sets = []
regex_funcs = ["dep:regex"]
urls = ["dep:url"]
ip = ["dep:ipnet"]
semver_funcs = ["dep:semver"]
format = []
quantity = []
jsonpatch = []
named_format = []
math = []
encoders = ["dep:base64"]
validation = ["dep:serde_json", "dep:serde", "dep:chrono", "dep:base64"]
# Umbrella: every extension-function library (the 13 in `default`) plus the
# `validation` engine. `default` enables the 13 functions only, NOT validation.
# Use `default-features = false` to narrow to a subset, then `full` to restore
# everything (functions + validation).
full = ["strings", "lists", "sets", "regex_funcs", "urls", "ip", "semver_funcs", "format", "quantity", "jsonpatch", "named_format", "math", "encoders", "validation"]

[[example]]
name = "basic"

[[example]]
name = "validate_crd"
required-features = ["validation"]

[[example]]
name = "compiled_schema"
required-features = ["validation"]

[[example]]
name = "timestamp_duration"
required-features = ["validation"]

[[example]]
name = "vap_evaluation"
required-features = ["validation"]

[[example]]
name = "static_analysis"
required-features = ["validation"]

[[example]]
name = "defaults_and_context"
required-features = ["validation"]

[[example]]
name = "kube_workflow"
required-features = ["validation"]

[[example]]
name = "error_chain"
required-features = ["validation"]

[[example]]
name = "message_expression"
required-features = ["validation"]

[[example]]
name = "transition_rules"
required-features = ["validation"]
