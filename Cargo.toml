[package]
name = "kube-cel"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Kubernetes CEL extension functions for the cel crate"
repository = "https://github.com/kube-rs/kube-cel"
documentation = "https://docs.rs/kube-cel"
homepage = "https://kube.rs"
keywords = ["kubernetes", "cel", "kube", "validation"]
categories = ["api-bindings"]
# What the crate ships: the library, its tests and examples (so `cargo test`
# works from the package; the README points at tests/apiserver_divergence.rs),
# and the docs. CI config, rustfmt.toml and the justfile stay in the repo.
include = ["/src/**", "/tests/**", "/examples/**", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# PUBLIC dependency: `cel` is re-exported (`pub use cel`) and appears in public
# signatures (`Env`, `Context`, `Value`, `Program`), so a `cel` semver bump is a
# breaking change for kube-cel. The caret `^0.16` is intentional — it lets
# downstreams pick up `cel` 0.16.x patches without a kube-cel release. Do not
# switch to an exact `=0.16.x` pin (it would block that patch uptake), and bump
# the major-coupling note in the versioning policy if this constraint changes.
# Before 0.9.0: raise the floor to the cel release carrying cel-rust#460 and
# #462 (`^0.16` still admits 0.16.0, where tests/apiserver_divergence.rs pins
# both fail-opens). `just release` refuses while such a note remains.
cel = "0.16"
# Lower bounds are the oldest versions that build and pass `cargo test` under
# `cargo +nightly update -Z direct-minimal-versions`. regex 1.10.5 is cel's own
# floor. chrono 0.4.39: cel 0.16 declares `chrono ^0.4` but uses
# `TimeDelta::MIN`/`MAX`, which older chrono lacks. serde 1.0.103 is the first to
# pin serde_derive exactly (older serde resolves a newer, incompatible derive);
# serde_json 1.0.25 is the first whose `json!` works from a 2018+ edition crate.
regex = "1.10.5"
ipnet = { version = "2", optional = true }
semver = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
serde = { version = "1.0.103", features = ["derive"], optional = true }
serde_json = { version = "1.0.25", optional = true }
chrono = { version = "0.4.39", default-features = false, features = ["alloc"] }

[dev-dependencies]
# "Never panics" property tests over the string parsers (tests/never_panic.rs).
# proptest 1.12's rust-version is 1.88, our MSRV.
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["strings", "lists", "sets", "regex_funcs", "urls", "ip", "semver_funcs", "format", "quantity", "named_format"]
strings = []
lists = []
sets = []
regex_funcs = []
urls = []
ip = ["dep:ipnet"]
semver_funcs = ["dep:semver"]
format = []
quantity = []
named_format = []
validation = ["dep:serde_json", "dep:serde", "dep:base64"]
# Umbrella: every extension-function library (the 10 in `default`) plus the
# `validation` engine. `default` enables the 10 libraries only, NOT validation.
# Use `default-features = false` to narrow to a subset, then `full` to restore
# everything (functions + validation).
full = ["strings", "lists", "sets", "regex_funcs", "urls", "ip", "semver_funcs", "format", "quantity", "named_format", "validation"]

[[example]]
name = "basic"

[[example]]
name = "validate_crd"
required-features = ["validation"]

[[example]]
name = "compiled_schema"
required-features = ["validation"]

[[example]]
name = "timestamp_duration"
required-features = ["validation"]

[[example]]
