name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      - name: fmt
        run: just fmt

      - name: clippy
        run: just clippy

      - name: test (all features)
        run: just test-all

      - name: test (no default features)
        run: just test-no-default

      - name: doc
        run: just doc

      - name: feature-check
        run: just feature-check

  # Live apiserver parity: drives the shared case table through a real
  # kube-apiserver (kind, `--dry-run=server`) and asserts kube-cel's verdict
  # matches. Self-catches apiserver-fidelity regressions a hand-written
  # expectation would miss. Pinned to the k8s version the cases were measured on.
  parity:
    name: apiserver parity (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # Installs the kind + kubectl binaries only; `just parity` creates and
      # tears down its own throwaway cluster (with the pinned node image).
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: parity (kube-cel verdict vs real apiserver)
        run: just parity
